# Sections of the Service page (_pages/service.md), rendered in this order by _includes/service.liquid.
# Each section needs a `title` (shown as a heading) and a list of `entries`.
#
# Entry fields, checked at build time by _plugins/service-data-check.rb:
#   role       required  shown in bold, e.g. "Teaching Assistant"
#   name       required  course or organization; linked when `url` is set
#   url        optional
#   org        optional  institution, shown muted under the name
#   dates      required
#   image      required  file name in assets/img/service/
#   image_alt  required  alt text for the image
#   image_fit  optional  `contain` (default) shows the whole image on a white tile, for logos;
#                        `cover` fills the frame and crops the edges, for photos and posters
#   entries    optional  sub-entries with the same fields, indented under this entry (one level only)

